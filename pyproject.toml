[project]
name = "casino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quick-sigma", email = "pyramidbuilder1@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.50.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
casino = "casino:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: Monte Carlo y tests de larga duración",
    "stat: tests estadísticos con tolerancia",
]



[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


